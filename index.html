
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>আমার ব্যক্তিগত ওয়েবসাইট</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #f0f4f8;
      color: #222;
      text-align: center;
    }
    header {
      background: #087f5b;
      color: white;
      padding: 35px 15px;
    }
    main {
      padding: 25px 15px;
    }
    .card {
      background: white;
      padding: 25px;
      margin: 20px auto;
      border-radius: 15px;
      max-width: 450px;
      box-shadow: 0 3px 12px #0001;
    }
    a {
      color: #087f5b;
    }
    footer {
      padding: 20px;
      background: #222;
      color: white;
    }
  </style>
</head>
<body>
  <header>
    <h1>স্বাগতম আমার ওয়েবসাইটে</h1>
    <p>এটি আমার ব্যক্তিগত ওয়েবসাইট</p>
  </header>

  <main>
    <div class="card">
      <h2>আমার পরিচয়</h2>
      <p>আমি বাংলাদেশ থেকে এসেছি।</p>
      <p>আমার নিজের ওয়েবসাইটে আপনাকে স্বাগতম।</p>
    </div>

    <div class="card">
      <h2>আমার যোগাযোগ</h2>
      <p>আমার সঙ্গে যোগাযোগ করতে নিচের লিংকে আসুন।</p>
      <a href="https://www.facebook.com/">Facebook</a>
    </div>
  </main>

  <footer>
    <p>© 2026 আমার ব্যক্তিগত ওয়েবসাইট</p>
  </footer>
</body>
</html>
